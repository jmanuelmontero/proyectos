
name: Compilar SIGMABUS ESP8266 a BIN

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.ino'
      - '.github/workflows/compilar.yml'

jobs:
  compilar:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configurar Arduino CLI
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266

      - name: Compilar SIGMABUS para Wemos D1 Mini
        run: |
          arduino-cli compile \
            --fqbn esp8266:esp8266:d1_mini \
            --output-dir build \
            --export-binaries \
            sigmabus_esp8266_v3

      - name: Guardar archivo BIN
        uses: actions/upload-artifact@v4
        with:
          name: firmware-SIGMABUS-ESP8266
          path: build/*.bin
          if-no-files-found: error
