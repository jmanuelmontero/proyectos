
name: Compilar ESP8266 a BIN

on:
  workflow_dispatch:
  push:
    paths:
      - '**.ino'
      - '.github/workflows/compilar.yml'

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configurar Arduino CLI
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266

      - name: Compilar para Wemos D1 Mini
        run: |
          arduino-cli compile \
            --fqbn esp8266:esp8266:d1_mini \
            --output-dir build \
            .

      - name: Guardar archivo BIN
        uses: actions/upload-artifact@v4
        with:
          name: firmware-ESP8266
          path: build/*.bin
